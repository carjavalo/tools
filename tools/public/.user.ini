; Límites de PHP para esta aplicación (los lee PHP-FPM/CGI en cPanel).
;
; El PDF del paquete de Radicar Solicitud puede pesar hasta 100 MB
; (RadicarCasoController::PAQUETE_MAX_MB). PHP debe aceptar ese archivo y la
; petición completa que lo lleva (formulario + archivo); si no, el archivo ni
; siquiera llega a Laravel. Los tiempos se amplían porque subir 100 MB por la
; red del hospital puede tardar varios minutos.
;
; Si el servidor no aplica este archivo, configure los mismos valores en
; cPanel > "Select PHP Version" > Options, o en "MultiPHP INI Editor".
upload_max_filesize = 110M
post_max_size = 120M
max_input_time = 600
max_execution_time = 300
memory_limit = 512M
